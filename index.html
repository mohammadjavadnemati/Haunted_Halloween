<!DOCTYPE html>
<html lang="fa" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hunted Halloween — Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Special+Elite&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="board-wrapper">

    <div class="fog-layer fog-layer--1"></div>
    <div class="fog-layer fog-layer--2"></div>
    <div class="moon"></div>
    <div class="bat bat--1">🦇</div>
    <div class="bat bat--2">🦇</div>
    

    <div class="title-row">
  <div class="moon-bench">
    <div class="moon-tile moon-tile--1">
      <div class="moon-photo"></div>
      <div class="moon-cloud" style="left:5%; top:20%; width:26%; height:22%;"></div>
      <div class="moon-cloud" style="left:42%; top:55%; width:24%; height:20%;"></div>
      <div class="moon-cloud" style="left:15%; top:62%; width:22%; height:18%;"></div>
    </div>
    <div class="moon-tile moon-tile--2">
      <div class="moon-photo"></div>
      <div class="moon-cloud" style="left:10%; top:22%; width:26%; height:22%;"></div>
      <div class="moon-cloud" style="left:40%; top:58%; width:24%; height:20%;"></div>
    </div>
    <div class="moon-tile moon-tile--3">
      <div class="moon-photo"></div>
      <div class="moon-cloud" style="left:20%; top:25%; width:26%; height:22%;"></div>
    </div>
    <div class="moon-tile moon-tile--4"><div class="moon-photo"></div></div>
    <div class="moon-tile moon-tile--5"><div class="moon-photo"></div></div>
    <div class="moon-tile moon-tile--6"><div class="moon-photo"></div></div>
  </div>
  <h1 class="board-title">Hunted <span>Halloween</span></h1>

</div>

    <div class="board-stage">
      <div class="board" id="game-board">

        

        <!-- ============ RIGHT VERTICAL PATH (11 tiles) ============ -->
        <div class="tile tile--start" style="grid-column:12; grid-row:2;"><span class="tile-label">START</span></div>
        <div class="tile tile--path" style="grid-column:12; grid-row:3;"></div>
        <div class="tile tile--path" style="grid-column:12; grid-row:4;"></div>
        <div class="tile tile--path" style="grid-column:12; grid-row:5;"></div>
        <div class="tile tile--path" style="grid-column:12; grid-row:6;"></div>
        <div class="tile tile--path" style="grid-column:12; grid-row:7;"></div>
        <div class="tile tile--path" style="grid-column:12; grid-row:8;"></div>
        <div class="tile tile--path" style="grid-column:12; grid-row:9;"></div>
        <div class="tile tile--path" style="grid-column:12; grid-row:10;"></div>
        <div class="tile tile--path" style="grid-column:12; grid-row:11;"></div>
        <div class="tile tile--start" style="grid-column:12; grid-row:12;"><span class="tile-label">START</span></div>

        <!-- Trick-or-treat houses beside tile 4 (top) and tile 8 (bottom, 4th from end) -->
        <div class="house-slot" data-role="house" style="grid-column:13; grid-row:5; --house-scale:1.64; --house-x:-2%; --house-y:27%;"></div>
        <div class="house-slot" data-role="house" style="grid-column:13; grid-row:9; --house-scale:1.8; --house-x:-18%; --house-y:46%;"></div>

        

        <!-- ============ ENTRANCE 2 : opposite side (direct, no gate arch) ============ -->
        <div class="tile tile--path" style="grid-column:2; grid-row:7;"></div>

        <div class="cemetery-ground" style="grid-column:2/13; grid-row:3/12;">
  <div class="cemetery-fence"></div>

  <div class="graveyard-layer">
    <!-- زنجیره افقی قبرستان -->
    <div class="tile tile--cemetery gy-tile" style="left:12%; top:50%;">C7</div>
    <div class="tile tile--cemetery gy-tile" style="left:25%; top:50%;">C6</div>
    <div class="tile tile--cemetery gy-tile tile--warded" style="left:38%; top:50%;">C5</div>
    <div class="tile tile--cemetery gy-tile" style="left:50%; top:50%;">C4</div>
    <div class="tile tile--cemetery gy-tile tile--warded" style="left:62%; top:50%;">C3</div>
    <div class="tile tile--cemetery gy-tile" style="left:75%; top:50%;">C2</div>
    <div class="tile tile--cemetery gy-tile" style="left:88%; top:50%;">C1</div>
    <!-- سنگ‌قبرهای سمت راست، قبل از تقاطع مرکزی -->
    <div class="gy-tomb gy-tomb-1" style="left:58%; top:28%;"></div>
    <div class="gy-tomb gy-tomb-2" style="left:71%; top:24%;"></div>
    <div class="gy-tomb gy-tomb-3" style="left:84%; top:28%;"></div>

    <div class="gy-tomb gy-tomb-4" style="left:58%; top:72%;"></div>
    <div class="gy-tomb gy-tomb-5" style="left:71%; top:76%;"></div>
    <div class="gy-tomb gy-tomb-6" style="left:84%; top:72%;"></div>

    <!-- شاخه عمودی، بالا از C4 -->
    <div class="tile tile--path gy-tile tile--warded" style="left:50%; top:38%;"></div>
    <div class="tile tile--path gy-tile" style="left:50%; top:26%;"></div>
    <div class="tile tile--path gy-tile" style="left:50%; top:14%;"></div>
    <div class="tile tile--path gy-tile" style="left:50%; top:4%;"></div>

    <!-- شاخه عمودی، پایین از C4 -->
    <div class="tile tile--path gy-tile tile--warded" style="left:50%; top:62%;"></div>
    <div class="tile tile--path gy-tile" style="left:50%; top:74%;"></div>
    <div class="tile tile--path gy-tile" style="left:50%; top:86%;"></div>
    <div class="tile tile--path gy-tile" style="left:50%; top:96%;"></div>

    <!-- ربع روح (پایین‌چپ) -->
    <div class="tile tile--ghost gy-tile gy-tile--ghost-start" style="left:14%; top:82%;"><span class="tile-label">START</span></div>
    <div class="tile tile--coffin gy-tile" style="left:23%; top:72%;"></div>
    <div class="tile tile--path gy-tile gy-tile--small" style="left:32%; top:69%;"></div>
    <div class="tile tile--path gy-tile gy-tile--small" style="left:41%; top:65%;"></div>
  </div>
</div>

        
        <!-- ============ GHOST TILE ============ -->
        <div class="tile tile--ghost" style="grid-column:6; grid-row:12;"></div>

        <!-- ============ RIGHT CHAIN FROM GHOST ============ -->
        <div class="tile tile--path" style="grid-column:7; grid-row:12;"></div>
        <div class="tile tile--path" style="grid-column:8; grid-row:12;"></div>
        <div class="tile tile--orange" style="grid-column:9; grid-row:12;"></div>
        <div class="tile tile--green" style="grid-column:10; grid-row:12;"></div>
        <div class="tile tile--path" style="grid-column:11; grid-row:12;"></div>

        <div class="house-slot" data-role="house" style="grid-column:8; grid-row:13; --house-scale:1.22;"></div>
        <div class="house-slot" data-role="house" style="grid-column:11; grid-row:13; --house-scale:1.33;"></div>

        <!-- ============ LEFT CHAIN FROM GHOST ============ -->
        <div class="tile tile--path" style="grid-column:5; grid-row:12;"></div>
        <div class="tile tile--path" style="grid-column:4; grid-row:12;"></div>
        <div class="tile tile--purple" style="grid-column:3; grid-row:12;"></div>
        <div class="tile tile--path" style="grid-column:2; grid-row:12;"></div>

        <div class="house-slot" data-role="house" style="grid-column:4; grid-row:13; --house-scale:1.2;"></div>
        <div class="house-slot" data-role="house" style="grid-column:1; grid-row:13; --house-scale:1.4; --house-x:39%; --house-y:3%; --house-rotate:20deg;"></div>

        <!-- ============ UPWARD CHAIN (col 2) ============ -->
        <div class="tile tile--green" style="grid-column:2; grid-row:11;"></div>
        <div class="tile tile--path" style="grid-column:2; grid-row:10;"></div>
        <div class="tile tile--orange" style="grid-column:2; grid-row:9;"></div>
        <div class="tile tile--path" style="grid-column:2; grid-row:8;"></div>
        <div class="tile tile--path" style="grid-column:2; grid-row:6;"></div>
        <div class="tile tile--path" style="grid-column:2; grid-row:5;"></div>
        <div class="tile tile--path" style="grid-column:2; grid-row:4;"></div>
        <div class="tile tile--path" style="grid-column:2; grid-row:3;"></div>
        <div class="tile tile--green" style="grid-column:2; grid-row:2;"></div>

        <div class="house-slot" data-role="house" style="grid-column:1; grid-row:10; --house-scale:1.4; --house-y:15%;"></div>
        <div class="house-slot" data-role="house" style="grid-column:1; grid-row:8; --house-scale:1.7; --house-y:38%;"></div>
        <div class="house-slot" data-role="house" style="grid-column:1; grid-row:5; --house-scale:1.2; --house-x:3%; --house-y:13%;"></div>

        <!-- ============ TOP CHAIN (row 2, turning right) ============ -->
        <div class="tile tile--path" style="grid-column:3; grid-row:2;"></div>
        <div class="tile tile--purple" style="grid-column:4; grid-row:2;"></div>
        <div class="tile tile--path" style="grid-column:5; grid-row:2;"></div>
        <div class="tile tile--orange" style="grid-column:6; grid-row:2;"></div>
        <div class="tile tile--green" style="grid-column:7; grid-row:2;"></div>
        <div class="tile tile--path" style="grid-column:8; grid-row:2;"></div>
        <div class="tile tile--path" style="grid-column:9; grid-row:2;"></div>

        <div class="house-slot" data-role="house" style="grid-column:3; grid-row:1; --house-scale:1.85; --house-x:-3%; --house-y:23%;"></div>
        <div class="house-slot" data-role="house" style="grid-column:5; grid-row:1; --house-scale:1.7;"></div>
        <div class="house-slot" data-role="house" style="grid-column:9; grid-row:1; --house-scale:1.8;"></div>

      </div>
    </div>
  </div>
<script src="script.js"></script>
</body>
</html>
